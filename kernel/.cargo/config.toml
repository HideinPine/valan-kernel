[build]
target = "x86_64-valan.json"

[future-incompat-report]
frequency = "never"

[unstable]
json-target-spec = true
build-std = ["core", "alloc", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]

[target.x86_64-valan]
runner = ["powershell", "-File","C:/Users/User/Projects/Valan/kernel/run.ps1"]